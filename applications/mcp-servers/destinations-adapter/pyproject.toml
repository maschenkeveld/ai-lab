[project]
name = "mcp-destinations-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.12.0",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_destinations_adapter*"]
