[project]
name = "travel-common"
version = "0.1.0"
description = "Shared building blocks for the travel-desk agents: model, MCP, A2A client/server, OTel"
requires-python = ">=3.12"
dependencies = [
  "fasta2a[pydantic-ai]>=2.1.1",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
  "pydantic-ai-slim[openai,mcp]>=2.64.0",
  "starlette>=0.40.0",
  "uvicorn[standard]>=0.32.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25.0",
  "opentelemetry-instrumentation-starlette>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-logging>=0.46b0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
