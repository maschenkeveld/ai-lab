[project]
name = "travel-desk-evals"
version = "0.1.0"
description = "Offline evals for the travel desk (pydantic-evals): requirement extraction, and live end-to-end invariants"
requires-python = ">=3.12"
dependencies = [
  "travel-common",
  "travel-coordinator",
  "pydantic-evals>=2.61.0",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.sources]
travel-common = { path = "../common", editable = true }
travel-coordinator = { path = "../coordinator", editable = true }
