[project]
name = "travel-destination-decision"
version = "0.1.0"
description = "Destination-decision specialist — picks one destination from a shortlist"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_destination_decision*"]
