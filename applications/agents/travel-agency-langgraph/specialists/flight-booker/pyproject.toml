[project]
name = "travel-flight-booker"
version = "0.1.0"
description = "Flight-booker specialist — books flights via REST API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langsmith>=0.1.100",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_flight_booker*"]
