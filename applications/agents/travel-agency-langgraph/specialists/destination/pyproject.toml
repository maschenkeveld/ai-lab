[project]
name = "travel-destination"
version = "0.1.0"
description = "Destination specialist — shortlists travel destinations via REST API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "faiss-cpu>=1.8.0",
  "httpx>=0.27.0",
  "langchain-community>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langsmith>=0.1.100",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_destination*"]
