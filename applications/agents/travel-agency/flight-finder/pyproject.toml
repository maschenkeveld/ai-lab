[project]
name = "travel-flight-finder"
version = "0.2.0"
description = "Flight-finder agent — quotes a flight via the flights MCP server, served over A2A"
requires-python = ">=3.12"
dependencies = ["travel-common"]

[tool.uv.sources]
travel-common = { path = "../common", editable = true }

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_flight_finder*"]
