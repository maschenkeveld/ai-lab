[project]
name = "travel-orchestrator"
version = "0.3.0"
description = "Orchestrator agent — plans and books a trip by calling specialist agents over A2A"
requires-python = ">=3.12"
dependencies = [
  "travel-common",
  "fastapi>=0.115.0",
  "psycopg[binary,pool]>=3.2.13",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
travel-common = { path = "../common", editable = true }

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
