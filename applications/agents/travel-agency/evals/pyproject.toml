[project]
name = "travel-evals"
version = "0.1.0"
description = "Offline evaluation of the travel orchestrator (pydantic-evals)"
requires-python = ">=3.12"
dependencies = [
  "travel-common",
  "pydantic-evals>=1.0",
  "httpx>=0.27",
]

[tool.uv.sources]
travel-common = { path = "../common", editable = true }

[tool.setuptools]
py-modules = ["evaluators", "run_eval"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
