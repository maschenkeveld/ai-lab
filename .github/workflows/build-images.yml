name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "applications/**"
      - "k8s/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "applications/**"
      - "k8s/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: ${{ github.repository }}

jobs:
  # PR-level checks (§21): fast, infra-free validation — no image build, no live cluster/agent
  # needed. The full eval dataset against a live orchestrator stays a manual/scheduled step
  # (see evals/run_eval.py and evals/tests/test_evaluators.py's module docstrings for why).
  validate:
    runs-on: ubuntu-latest
    outputs:
      images-affected: ${{ steps.filter.outputs.images-affected }}
    steps:
      - uses: actions/checkout@v4

      # evals/** has no built image (see matrix in the build job below) — on an evals-only
      # change, skip the build job below instead of rebuilding all 12 images for nothing.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            images-affected:
              - "applications/**"
              - "!applications/agents/travel-agency-langgraph/evals/**"
              - "k8s/**"

      - uses: astral-sh/setup-uv@v3
      - name: Lint Python (ruff)
        run: uvx ruff check applications/agents applications/mcp-servers

      - name: Unit-test deterministic evaluators
        working-directory: applications/agents/travel-agency-langgraph/evals
        run: uv run --group dev pytest tests/ -v

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - name: Vet Go REST servers and MCP dice-roller
        run: |
          for mod in applications/rest-servers/destinations applications/rest-servers/flights applications/rest-servers/book-flights applications/mcp-servers/dice-roller; do
            (cd "$mod" && go vet ./...)
          done

      - name: Validate Kubernetes manifest YAML
        run: |
          uv run --with pyyaml python -c "
          import pathlib, sys, yaml
          failed = False
          for path in pathlib.Path('k8s').rglob('*.yaml'):
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as e:
                  print(f'{path}: {e}', file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          "

  build:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.validate.outputs.images-affected == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: rest-destinations
            context: applications/rest-servers/destinations
          - image: rest-flights
            context: applications/rest-servers/flights
          - image: rest-book-flights
            context: applications/rest-servers/book-flights
          - image: mcp-dice-roller
            context: applications/mcp-servers/dice-roller
          - image: mcp-destinations
            context: applications/mcp-servers/destinations-adapter
          - image: mcp-flights
            context: applications/mcp-servers/flights-adapter
          - image: mcp-book-flights
            context: applications/mcp-servers/book-flights-adapter
          - image: travel-orchestrator-langgraph
            context: applications/agents/travel-agency-langgraph/orchestrator
          - image: travel-destination
            context: applications/agents/travel-agency-langgraph/specialists/destination
          - image: travel-destination-decision
            context: applications/agents/travel-agency-langgraph/specialists/destination-decision
          - image: travel-flight-finder
            context: applications/agents/travel-agency-langgraph/specialists/flight-finder
          - image: travel-flight-booker
            context: applications/agents/travel-agency-langgraph/specialists/flight-booker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
