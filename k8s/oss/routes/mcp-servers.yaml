apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-dice-roller
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: dice-roller
        static:
          host: mcp-dice-roller.mcp-dice-roller.svc.cluster.local
          port: 8000
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-destinations
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: destinations
        static:
          host: mcp-destinations.mcp-destinations.svc.cluster.local
          port: 8000
          path: /mcp
          protocol: StreamableHTTP
---
