  name: mcp-book-flights
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: book-flights
        static:
          host: mcp-book-flights.mcp-book-flights.svc.cluster.local
          port: 8000
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-dice-roller
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp-dice-roller
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: mcp-dice-roller
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
