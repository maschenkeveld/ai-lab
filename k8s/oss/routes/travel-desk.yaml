apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-trip-coordinator
  namespace: travel-desk
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a2a/trip-coordinator
      backendRefs:
        - name: coordinator
          port: 4300
---
