apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: travel-orchestrator-langgraph
  namespace: travel-agency-langgraph
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a2a/travel-orchestrator
      backendRefs:
        - name: travel-orchestrator-langgraph
          port: 4200
---
