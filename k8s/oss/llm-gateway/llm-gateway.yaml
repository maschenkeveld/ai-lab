# The lab's LLM gateway: every model call goes through agentgateway.
#
#   http://agentgateway.lab/llm/openai/v1    OpenAI chat (gpt-4o-mini) and embeddings (text-embedding-3-small)
#   http://agentgateway.lab/llm/gemini/v1    Gemini (gemini-2.5-pro)
#   http://agentgateway.lab/llm/ollama/v1    Ollama on the Mac (llama3.2)
#   http://agentgateway.lab/llm/local/v1     vLLM-Metal on the Mac (the model `task inference:run` serves)
#
# Clients use any OpenAI client with base_url=<one of the above> and `Authorization: Bearer <LLM_GATEWAY_KEY>`. The model
# is chosen by the route; the `model` a client sends is replaced by the backend's model, and the gateway adds the provider's
# own key, so clients never hold one. Guardrails run in front of every chat backend: a prompt-injection phrase is rejected
# with a 403 and emails, card numbers and SSNs are masked before the model sees them.
#
# Apply with `task llm-gateway:apply` (it fills in the placeholders); the secrets come from `task secrets:llm-gateway`.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-openai-chat
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: gpt-4o-mini
  policies:
    auth:
      secretRef:
        name: llm-openai-key
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/models": Models
      promptGuard:
        request:
          - regex:
              action: Reject
              matches:
                - "(?i)ignore (all |your )?(previous |prior )?instructions"
            response:
              message: "Blocked by the gateway: looks like a prompt-injection attempt."
              statusCode: 403
          - regex:
              action: Mask            # personal data is replaced before the model sees it
              builtins: [CreditCard, Ssn, Email]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-openai-embeddings
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: text-embedding-3-small
  policies:
    auth:
      secretRef:
        name: llm-openai-key
    ai:
      routes:
        "/v1/embeddings": Embeddings
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-gemini
  namespace: agentgateway-system
spec:
  ai:
    provider:
      gemini:
        model: gemini-2.5-pro
  policies:
    auth:
      secretRef:
        name: llm-gemini-key
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/models": Models
      promptGuard:
        request:
          - regex:
              action: Reject
              matches:
                - "(?i)ignore (all |your )?(previous |prior )?instructions"
            response:
              message: "Blocked by the gateway: looks like a prompt-injection attempt."
              statusCode: 403
          - regex:
              action: Mask            # personal data is replaced before the model sees it
              builtins: [CreditCard, Ssn, Email]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-ollama
  namespace: agentgateway-system
spec:
  ai:
    provider:
      host: ollama.default.svc.cluster.local     # Ollama on the Mac, through the cluster's `ollama` Service
      port: 11434
      openai:
        model: llama3.2
  policies:
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/models": Models
      promptGuard:
        request:
          - regex:
              action: Reject
              matches:
                - "(?i)ignore (all |your )?(previous |prior )?instructions"
            response:
              message: "Blocked by the gateway: looks like a prompt-injection attempt."
              statusCode: 403
          - regex:
              action: Mask            # personal data is replaced before the model sees it
              builtins: [CreditCard, Ssn, Email]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-local
  namespace: agentgateway-system
spec:
  ai:
    provider:
      host: __VLLM_HOST__          # the Mac as the cluster sees it (`task inference:url`); filled in by `task llm-gateway:apply`
      port: __VLLM_PORT__
      openai:
        model: __VLLM_MODEL__
  policies:
    auth:
      secretRef:
        name: llm-local-key
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/models": Models
      promptGuard:
        request:
          - regex:
              action: Reject
              matches:
                - "(?i)ignore (all |your )?(previous |prior )?instructions"
            response:
              message: "Blocked by the gateway: looks like a prompt-injection attempt."
              statusCode: 403
          - regex:
              action: Mask            # personal data is replaced before the model sees it
              builtins: [CreditCard, Ssn, Email]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-openai
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/openai/v1/embeddings
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/embeddings
      backendRefs:
        - name: llm-openai-embeddings
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /llm/openai
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: llm-openai-chat
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gemini
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/gemini
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: llm-gemini
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-ollama
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/ollama
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: llm-ollama
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-local
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  hostnames:
    - agentgateway.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/local
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
