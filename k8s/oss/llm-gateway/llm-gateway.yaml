          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# Every LLM route needs a client key: without it, anyone who can reach the gateway could spend the provider keys.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-openai-auth
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-openai
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: llm-gateway-client-keys
---
# Every LLM route needs a client key: without it, anyone who can reach the gateway could spend the provider keys.
