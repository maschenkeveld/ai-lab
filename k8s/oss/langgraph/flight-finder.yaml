apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-flight-finder
  namespace: travel-agency-langgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-flight-finder
  template:
    metadata:
      labels:
        app: travel-flight-finder
    spec:
      containers:
        - name: travel-flight-finder
          image: travel-flight-finder:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4203
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_ENDPOINT__
            - name: PORT
              value: "4203"
            - name: AGENT_NAME
              value: travel-flight-finder
            - name: PUBLIC_AGENT_BASE_URL
              value: http://agentgateway.lab/a2a/flight-finder
            - name: API_BASE_URL
              value: http://traefik.traefik.svc.cluster.local
            - name: API_HOST_HEADER
              value: traefik-api-gw.lab
            - name: LANGCHAIN_TRACING_V2
              value: "true"
            - name: LANGCHAIN_ENDPOINT
              value: "https://eu.api.smith.langchain.com"
            - name: LANGCHAIN_PROJECT
              value: ai-lab-oss
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langsmith-secret
                  key: api-key
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: travel-flight-finder
  namespace: travel-agency-langgraph
spec:
  selector:
    app: travel-flight-finder
  ports:
    - name: http
      port: 4203
      targetPort: 4203
