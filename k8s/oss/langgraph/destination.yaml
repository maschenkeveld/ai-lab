apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-destination
  namespace: travel-agency-langgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-destination
  template:
    metadata:
      labels:
        app: travel-destination
    spec:
      containers:
        - name: travel-destination
          image: travel-destination:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4201
          env:
            - name: PORT
              value: "4201"
            - name: AGENT_NAME
              value: travel-destination
            - name: PUBLIC_AGENT_BASE_URL
              value: http://agentgateway.lab/a2a/destination
            - name: API_BASE_URL
              value: http://traefik.traefik.svc.cluster.local
            - name: API_HOST_HEADER
              value: traefik-api-gw.lab
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: LITELLM_EMBEDDING_MODEL
              value: embedding-openai
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: LITELLM_MASTER_KEY
                  optional: true
            - name: LANGCHAIN_TRACING_V2
              value: "true"
            - name: LANGCHAIN_PROJECT
              value: ai-lab-oss
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langsmith-secret
                  key: api-key
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: travel-destination
  namespace: travel-agency-langgraph
spec:
  selector:
    app: travel-destination
  ports:
    - name: http
      port: 4201
      targetPort: 4201
