apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: travel-agency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: travel-agency-orchestrator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4200
          readinessProbe:
            httpGet:
              path: /health
              port: 4200
            periodSeconds: 5
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_ENDPOINT__
            - name: PORT
              value: "4200"
            - name: AGENT_NAME
              value: travel-orchestrator
            - name: PUBLIC_AGENT_BASE_URL
              value: http://agentgateway.lab/a2a/travel-orchestrator
            - name: AGENTGATEWAY_URL
              value: http://agentgateway.lab
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: LITELLM_MODEL
              value: openai-gpt
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres.llm-analytics.svc.cluster.local:5432/llm_analytics?sslmode=disable
            # Pre-cutover: call the specialists directly, since agentgateway's /a2a routes still point at the old stack.
            - name: SPECIALIST_DESTINATION
              value: http://agentgateway.lab/a2a/destination
            - name: SPECIALIST_DESTINATION_DECISION
              value: http://agentgateway.lab/a2a/destination-decision
            - name: SPECIALIST_FLIGHT_FINDER
              value: http://agentgateway.lab/a2a/flight-finder
            - name: SPECIALIST_FLIGHT_BOOKER
              value: http://agentgateway.lab/a2a/flight-booker
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: travel-agency
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 4200
      targetPort: 4200
