apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-agent
  namespace: travel-desk
spec:
  replicas: 1
  strategy:
    type: Recreate   # one workflow engine per database: never two pods of the same agent at once
  selector:
    matchLabels:
      app: booking-agent
  template:
    metadata:
      labels:
        app: booking-agent
    spec:
      containers:
        - name: booking-agent
          image: travel-desk-booking-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4303
          readinessProbe:
            httpGet:
              path: /health
              port: 4303
            periodSeconds: 5
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_ENDPOINT__
            - name: PORT
              value: "4303"
            - name: AGENT_NAME
              value: "booking-agent"
            - name: PUBLIC_AGENT_BASE_URL
              value: "http://agentgateway.lab/a2a/booking-agent"
            - name: AGENTGATEWAY_URL
              value: "http://agentgateway.lab"
            - name: LITELLM_BASE_URL
              value: "http://litellm.litellm.svc.cluster.local:4000/v1"
            - name: LITELLM_MODEL
              value: "openai-gpt"
---
apiVersion: v1
kind: Service
metadata:
  name: booking-agent
  namespace: travel-desk
spec:
  selector:
    app: booking-agent
  ports:
    - name: http
      port: 4303
      targetPort: 4303
