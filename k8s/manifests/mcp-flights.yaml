apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-flights
  namespace: mcp-flights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-flights
  template:
    metadata:
      labels:
        app: mcp-flights
    spec:
      containers:
        - name: mcp-flights
          image: mcp-flights:latest
          imagePullPolicy: Never
          env:
            - name: FLIGHTS_BASE_URL
              value: http://rest-flights.rest-flights.svc.cluster.local:8000
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            - name: MCP_PATH
              value: /mcp
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-flights
  namespace: mcp-flights
spec:
  selector:
    app: mcp-flights
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
      appProtocol: agentgateway.dev/mcp
