apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-flights
  namespace: rest-flights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-flights
  template:
    metadata:
      labels:
        app: rest-flights
    spec:
      containers:
        - name: rest-flights
          image: rest-flights:latest
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_ENDPOINT__
            - name: OTEL_SERVICE_NAME
              value: rest-flights
            - name: OTEL_ENVIRONMENT
              value: lab
            - name: OTEL_LOGS_ENABLED
              value: "true"
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_PROPAGATION_ENABLED
              value: "true"
            - name: OTEL_METRICS_ENABLED
              value: "true"
            - name: FARE_TICK_SECONDS     # fares re-roll every 30s so the fare-watcher has something to watch
              value: "30"
            - name: ENABLE_FARE_SHOCKS    # POST /v1/fare-shocks, for the demo's "simulate a fare drop"
              value: "true"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: rest-flights
  namespace: rest-flights
spec:
  selector:
    app: rest-flights
  ports:
    - port: 8000
      targetPort: 8000
