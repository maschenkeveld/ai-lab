apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: default
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-1
  namespace: default
  labels:
    kubernetes.io/service-name: ollama
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 11434
endpoints:
  - addresses:
      - 192.168.64.1
