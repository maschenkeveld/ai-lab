[project]
name = "example-durable-approval"
version = "0.1.0"
description = "A durable workflow that waits for a human and survives a kill and restart"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=2.61.0",
    "opentelemetry-sdk>=1.34,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
    "dbos>=2.10.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
