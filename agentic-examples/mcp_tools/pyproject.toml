[project]
name = "example-mcp-tools"
version = "0.1.0"
description = "An agent using MCP tools, with its own tiny MCP server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=2.61.0",
    "opentelemetry-sdk>=1.34,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
    "fastmcp>=2.12.0",
    "pydantic-ai-slim[mcp]>=2.61.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
