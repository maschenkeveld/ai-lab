[project]
name = "example-a2a-pair"
version = "0.1.0"
description = "Two agents talking A2A: a planner that asks a scout over the wire"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=2.61.0",
    "opentelemetry-sdk>=1.34,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
    "fasta2a[pydantic-ai]>=2.1.1",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
