version: '3'

# Run from this folder: `cd agentic-examples/tool_facts && task run`. The repo's .env is passed to uv.

tasks:
  run:
    desc: Run main.py against the lab's LiteLLM (add -- --liar for the lying model, no LLM needed)
    cmds:
      - uv run --env-file ../../.env python main.py {{.CLI_ARGS}}

  run:local:
    desc: Run main.py against vLLM on this Mac (start it with `cd ../../k8s && task inference:run`)
    cmds:
      - |
        set -a; . ../../.env; set +a
        LLM_BASE_URL=http://127.0.0.1:${VLLM_PORT:-8000}/v1 LLM_API_KEY=$VLLM_API_KEY LLM_MODEL=$VLLM_MODEL \
          uv run python main.py {{.CLI_ARGS}}

  test:
    desc: Offline tests of the guarantees (no model, no network)
    cmds:
      - uv run pytest -q

  evals:
    desc: Score a model on the task (-- --model <alias> to compare)
    cmds:
      - uv run --env-file ../../.env python evals.py {{.CLI_ARGS}}
